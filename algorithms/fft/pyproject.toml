[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algo-fft"
version = "1.0.0"
description = "Cooley-Tukey radix-2 DIT FFT and IFFT — pure Python, zero dependencies."
readme = "docs/README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["fft", "dft", "signal-processing", "algorithm", "semver"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
