[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algo-pid"
version = "1.0.0"
description = "Discrete position-form PID controller with anti-windup and output clamping."
readme = "docs/README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["pid", "control", "algorithm", "semver"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
