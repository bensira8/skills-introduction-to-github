[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algo-modulation"
version = "1.0.0"
description = "AM (DSB-SC, DSB-LC) and FM modulation/demodulation — pure Python."
readme = "docs/README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["am", "fm", "modulation", "demodulation", "signal-processing", "semver"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
